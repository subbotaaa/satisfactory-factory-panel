<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель бизнесов — Big Ambitions Monitor</title>
<meta name="theme-color" content="#1d2620">
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel2: #24282f;
    --border: #32363e;
    --text: #e8e6e3;
    --muted: #9a9fa8;
    --accent: #58c470;
    --green: #4caf50;
    --red: #ef5350;
    --yellow: #ffc94d;
    --blue: #64b5f6;
    --orange: #fa9549;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 2px solid var(--accent);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; color: var(--accent); white-space: nowrap; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    padding: 8px 18px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel2); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .tab.active { background: var(--accent); color: #12160f; font-weight: 600; border-color: var(--accent); }
  .tab .badge {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px;
    border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
  }
  .spacer { flex: 1; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
  .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
  main { padding: 16px 20px 40px; max-width: 1400px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
  .card .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .card .value { font-size: 24px; font-weight: 700; }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card.red .value { color: var(--red); }
  .card.green .value { color: var(--green); }
  .card.yellow .value { color: var(--yellow); }
  .card.blue .value { color: var(--blue); }

  .biz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .biz {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
  }
  .biz.closed { opacity: .6; }
  .biz h3 { margin: 0 0 2px; font-size: 16px; }
  .biz .addr { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .biz .row { display: flex; justify-content: space-between; font-size: 13px; margin: 3px 0; }
  .biz .row .k { color: var(--muted); }
  .biz .alert-chip {
    display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 700;
    background: var(--red); color: #fff; margin-left: 8px; vertical-align: 2px;
  }
  .satbar { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 12px; }
  .satbar .k { width: 110px; color: var(--muted); }
  .satbar .track { flex: 1; height: 7px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
  .satbar .fill { height: 100%; border-radius: 4px; }
  .satbar .v { width: 34px; text-align: right; }
  .spark { width: 100%; height: 46px; margin-top: 8px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: var(--panel2); color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .prio-High, .prio-Critical { color: var(--red); font-weight: 700; }
  .prio-Medium { color: var(--yellow); }
  .prio-Low { color: var(--muted); }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel2); }
  tr.clickable.sel td { background: rgba(88,196,112,.12); box-shadow: inset 2px 0 0 var(--accent); }

  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; font-size: 13px;
  }
  .chart-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .chart-box h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
  .chart-box canvas { width: 100%; height: 220px; }
  h2 { font-size: 16px; margin: 20px 0 10px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg-btn { padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--muted); background: var(--panel2); }
  .seg-btn.active { background: var(--accent); color: #12160f; font-weight: 600; }

  /* Сетка расписания */
  .sched { overflow-x: auto; }
  .sched table { min-width: 720px; }
  .sched th, .sched td { padding: 2px 4px; text-align: center; border: 1px solid var(--border); font-size: 11px; }
  .sched .dname { text-align: left; white-space: nowrap; font-weight: 600; padding: 4px 8px; }
  .cell { height: 24px; }
  .cell.closed { background: #16181c; }
  .cell.open { background: #23312a; }
  .cell.gap { background: rgba(239,83,80,.35); }
  .cell.cov { background: var(--accent); color: #12160f; font-weight: 700; }
  .emp-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .hbar { height: 7px; border-radius: 4px; background: var(--panel2); overflow: hidden; margin-top: 4px; }
  .hbar > div { height: 100%; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; background: var(--panel2); color: var(--muted); margin: 1px 2px; }
  .plan-in { width: 54px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px; text-align: center; font-size: 12px; }
  .skills { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
  .skill-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .skill-row .sk-name { width: 108px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skill-row .sk-track { flex: 1; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
  .skill-row .sk-fill { display: block; height: 100%; border-radius: 3px; }
  .skill-row .sk-val { width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
  .warn { color: var(--red); font-weight: 700; }
  .ok { color: var(--green); }
  tr.dim td { opacity: .45; }
  tr.absent td { background: rgba(255,201,77,.06); }
  .plan-in:disabled { opacity: .35; cursor: not-allowed; }
  .plan-in.wide { width: 118px; }
  .tab.disabled { opacity: .45; cursor: not-allowed; }
  .btn-blue { background: var(--blue); color: #0b1520; border-color: var(--blue); font-weight: 600; }
  .delta-up { color: var(--green); } .delta-down { color: var(--red); }
  .mini { font-size: 11px; color: var(--muted); }
  .risk-high td { background: rgba(239,83,80,.08); }
  .traffic { width: 100%; height: 70px; }
  td.num input.plan-in { width: 64px; }
</style>
</head>
<body>
<header>
  <h1>💼 Big Ambitions</h1>
  <div class="tabs">
    <div class="tab active" data-tab="overview">Обзор</div>
    <div class="tab" data-tab="businesses">Бизнесы</div>
    <div class="tab" data-tab="problems">Проблемы<span class="badge" id="problemsBadge" style="display:none">0</span></div>
    <div class="tab" data-tab="inventory">Склад</div>
    <div class="tab" data-tab="purchase">Закупки</div>
    <div class="tab" data-tab="sales">Продажи</div>
    <div class="tab" data-tab="analytics">Аналитика</div>
    <div class="tab" data-tab="prices">Цены</div>
    <div class="tab" data-tab="staff">Сотрудники</div>
    <div class="tab" data-tab="hr">Кадры<span class="badge" id="hrBadge" style="display:none">0</span></div>
    <div class="tab" data-tab="network">Сеть</div>
    <div class="tab" data-tab="finances">Финансы</div>
  </div>
  <div class="spacer"></div>
  <div class="conn"><span id="gameClock"></span><div class="dot" id="connDot"></div><span id="connText">нет связи</span></div>
</header>
<main>
  <section id="overview" class="active">
    <div class="cards" id="overviewCards"></div>
    <div class="chart-box"><h3>Прибыль по дням (все бизнесы)</h3><canvas id="profitChart"></canvas></div>
    <h2>Требуют внимания</h2>
    <div id="overviewProblems"></div>
  </section>

  <section id="businesses">
    <div class="biz-grid" id="bizGrid"></div>
  </section>

  <section id="problems">
    <div id="problemsList"></div>
  </section>

  <section id="inventory">
    <div class="toolbar">
      <select id="invBuilding"></select>
      <input id="invFilter" type="text" placeholder="Фильтр по товару...">
    </div>
    <div id="invTables"></div>
  </section>

  <section id="purchase">
    <div class="toolbar">
      <select id="purchaseBuilding"></select>
      <label style="font-size:12px;color:var(--muted)">Запас на дней: <input id="purchaseDays" class="plan-in" type="number" min="1" max="30" value="7"></label>
      <select id="purchaseWholesaler"></select>
    </div>
    <div id="purchaseView"></div>
  </section>

  <section id="analytics">
    <div class="toolbar"><select id="analyticsBuilding"></select></div>
    <div id="analyticsView"></div>
  </section>

  <section id="prices">
    <div class="toolbar"><select id="pricesBuilding"></select></div>
    <div id="pricesView"></div>
  </section>

  <section id="hr">
    <div id="hrView"></div>
  </section>

  <section id="network">
    <div id="networkView"></div>
  </section>

  <section id="sales">
    <div class="toolbar">
      <select id="salesBuilding"></select>
      <input id="salesFilter" type="text" placeholder="Фильтр по товару...">
    </div>
    <div id="salesTables"></div>
  </section>

  <section id="staff">
    <div class="toolbar">
      <select id="staffBuilding"></select>
      <div class="seg">
        <span class="seg-btn active" data-staffview="view">Просмотр</span>
        <span class="seg-btn" data-staffview="planner">Планировщик</span>
      </div>
    </div>
    <div id="staffView"></div>
    <div id="staffPlanner" style="display:none"></div>
  </section>

  <section id="finances">
    <div class="chart-box"><h3>Недельный доход игрока</h3><canvas id="weeklyChart"></canvas></div>
    <h2>Отчёт за последний день</h2>
    <div id="pnlTable"></div>
  </section>
</main>

<script>
const API = new URLSearchParams(location.search).get('api') || (location.protocol.startsWith('http') ? '' : 'http://localhost:8113');
let snap = null;
let invBuildingSel = '__all__';
let salesBuildingSel = '__all__';
let salesSel = {}; // bkey -> выбранный товар для графика
let staffBuildingSel = null;
let staffViewMode = 'view';
let purchaseBuildingSel = null, purchaseWholesalerSel = null, analyticsBuildingSel = null, pricesBuildingSel = null;
let priceEdits = {}; // bkey -> { item: price }
const bkeyOf = (b) => b.street + '|' + b.number;
function bizName(b) { return b.name || pretty(b.type) || 'Здание'; }
function fillBuildingSelect(sel, list, current) {
  sel.innerHTML = list.map(b => `<option value="${esc(bkeyOf(b))}">${esc(bizName(b))} (${esc(addr(b))})</option>`).join('');
  const keys = list.map(bkeyOf);
  const val = keys.includes(current) ? current : keys[0];
  if (val) sel.value = val;
  return list.find(b => bkeyOf(b) === val);
}
async function postJson(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
let staffRoleSel = '__all__'; // должность (навык) для авто-распределения/применения
let staffPlan = loadPlan(); // { bkey: { empId: { dayIndex: hours } } }

const DAY_RU = { Monday:'Пн', Tuesday:'Вт', Wednesday:'Ср', Thursday:'Чт', Friday:'Пт', Saturday:'Сб', Sunday:'Вс' };
function dayRu(name) { return DAY_RU[name] || name; }
function loadPlan() { try { return JSON.parse(localStorage.getItem('ba_plan') || '{}'); } catch (e) { return {}; } }
function savePlan() { try { localStorage.setItem('ba_plan', JSON.stringify(staffPlan)); } catch (e) {} }

/* ---------- helpers ---------- */
function fmtMoney(v) {
  const sign = v < 0 ? '-' : '';
  v = Math.abs(v || 0);
  let s;
  if (v >= 1e6) s = (v / 1e6).toFixed(2) + ' млн';
  else if (v >= 1e4) s = (v / 1e3).toFixed(1) + ' тыс';
  else s = v.toFixed(0);
  return sign + '$' + s;
}
function pretty(key) {
  if (!key) return '—';
  let s = String(key);
  const i = s.indexOf(':');
  if (i >= 0) s = s.slice(i + 1);
  s = s.replace(/^(itemname_|businesstype_|street_)/, '');
  s = s.replace(/_/g, ' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function addr(b) { return pretty(b.street) + ', ' + b.number; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function satColor(v) { return v >= 70 ? 'var(--green)' : v >= 40 ? 'var(--yellow)' : 'var(--red)'; }

const PROBLEM_NAMES = {
  LowStock: 'Мало товара', EmptyStock: 'Товар закончился', DirtyFloors: 'Грязный пол',
  PayTaxes: 'Оплатить налоги', EmployeeIdle: 'Сотрудник простаивает', LowHunger: 'Голод',
  LowHealth: 'Низкое здоровье', UnhappyEmployee: 'Недовольный сотрудник',
  BrokenFurniture: 'Сломанная мебель', MissingRequiredItem: 'Не хватает оборудования',
  MissingSchedule: 'Нет расписания', NoProducers: 'Нет производителей',
  EmployeeUnassigned: 'Сотрудник не назначен', BusinessTemporarilyClosed: 'Бизнес закрыт',
  MissingRequiredItemCount: 'Мало оборудования', UnpaidLicensingFees: 'Неоплаченные лицензии',
};
function problemName(t) { return PROBLEM_NAMES[t] || t; }

/* ---------- charts (canvas, без библиотек) ---------- */
function drawBars(canvas, points, colorFn) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (!points.length) return;
  const padB = 18, padT = 12;
  const vals = points.map(p => p.v);
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  const range = (max - min) || 1;
  const y0 = padT + (max / range) * (h - padT - padB);
  const bw = Math.max(3, Math.min(40, (w - 10) / points.length - 3));
  ctx.strokeStyle = 'rgba(154,159,168,.35)';
  ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(w, y0); ctx.stroke();
  ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  points.forEach((p, i) => {
    const x = 5 + i * ((w - 10) / points.length) + ((w - 10) / points.length - bw) / 2;
    const bh = Math.abs(p.v) / range * (h - padT - padB);
    ctx.fillStyle = colorFn ? colorFn(p.v) : (p.v >= 0 ? '#4caf50' : '#ef5350');
    if (p.v >= 0) ctx.fillRect(x, y0 - bh, bw, Math.max(1, bh));
    else ctx.fillRect(x, y0, bw, Math.max(1, bh));
    if (points.length <= 31 && p.label != null) {
      ctx.fillStyle = 'rgba(154,159,168,.8)';
      ctx.fillText(String(p.label), x + bw / 2, h - 4);
    }
  });
}

/* ---------- rendering ---------- */
function renderOverview() {
  const g = snap.game;
  const businesses = snap.businesses.filter(b => b.hasBusiness);
  const problems = snap.problems;
  const lastDay = snap.finances.dailySummaries.at(-1);
  const cards = [
    { label: 'Наличные', value: fmtMoney(g.money), cls: g.money >= 0 ? 'green' : 'red' },
    { label: 'Капитал', value: fmtMoney(g.netWorth), cls: 'blue' },
    { label: 'Бизнесов', value: businesses.length, sub: snap.businesses.length - businesses.length + ' зданий без бизнеса', cls: '' },
    { label: 'Проблем', value: problems.length, cls: problems.length ? 'red' : 'green' },
    { label: 'Прибыль за день ' + (lastDay ? lastDay.day : '—'), value: lastDay ? fmtMoney(lastDay.totalProfit) : '—', cls: lastDay && lastDay.totalProfit >= 0 ? 'green' : 'red' },
  ];
  document.getElementById('overviewCards').innerHTML = cards.map(c =>
    `<div class="card ${c.cls}"><div class="label">${c.label}</div><div class="value">${c.value}</div>${c.sub ? `<div class="sub">${c.sub}</div>` : ''}</div>`
  ).join('');

  drawBars(document.getElementById('profitChart'),
    snap.finances.dailySummaries.map(s => ({ label: s.day, v: s.totalProfit })));

  const top = problems.filter(p => p.priority === 'High' || p.priority === 'Critical').slice(0, 10);
  document.getElementById('overviewProblems').innerHTML = top.length
    ? problemsTable(top)
    : '<div class="empty">Срочных проблем нет 🎉</div>';
}

function spark(b) {
  return `<canvas class="spark" data-biz="${esc(b.street)}|${b.number}"></canvas>`;
}

function renderBusinesses() {
  const grid = document.getElementById('bizGrid');
  const list = snap.businesses.filter(b => b.hasBusiness);
  if (!list.length) { grid.innerHTML = '<div class="empty">Нет бизнесов</div>'; return; }
  grid.innerHTML = list.map(b => {
    const s = b.satisfaction || {};
    const lastOrder = (b.orderDays || []).at(-1);
    return `<div class="biz ${b.temporarilyClosed ? 'closed' : ''}">
      <h3>${esc(b.name || pretty(b.type))}${b.alerts ? `<span class="alert-chip">⚠ ${b.alerts}</span>` : ''}</h3>
      <div class="addr">${esc(pretty(b.type))} · ${esc(addr(b))}${b.temporarilyClosed ? ' · <b style="color:var(--red)">ЗАКРЫТ</b>' : ''}</div>
      <div class="row"><span class="k">Средний доход/день (7д)</span><b class="${b.avgDailyIncome >= 0 ? 'pos' : 'neg'}">${fmtMoney(b.avgDailyIncome)}</b></div>
      <div class="row"><span class="k">Покупателей вчера</span><b>${lastOrder ? lastOrder.customers : '—'}</b></div>
      <div class="row"><span class="k">Выручка вчера</span><b>${lastOrder ? fmtMoney(lastOrder.revenue) : '—'}</b></div>
      <div class="row"><span class="k">Сотрудников</span><b>${b.employees}</b></div>
      <div class="row"><span class="k">Аренда/день</span><b>${fmtMoney(b.rentPerDay)}</b></div>
      ${['overall|Общая', 'customerService|Обслуживание', 'pricing|Цены', 'cleanliness|Чистота', 'facility|Помещение'].map(x => {
        const [k, label] = x.split('|'); const v = s[k] ?? 0;
        return `<div class="satbar"><span class="k">${label}</span><div class="track"><div class="fill" style="width:${v}%;background:${satColor(v)}"></div></div><span class="v">${v}</span></div>`;
      }).join('')}
      ${spark(b)}
    </div>`;
  }).join('');

  grid.querySelectorAll('canvas.spark').forEach(cv => {
    const [street, number] = cv.dataset.biz.split('|');
    const b = list.find(x => x.street === street && String(x.number) === number);
    if (b) drawBars(cv, (b.dailyIncomes || []).map((v, i) => ({ v })));
  });
}

function problemsTable(list) {
  return `<table><thead><tr><th>Проблема</th><th>Приоритет</th><th>Где</th><th>Товар</th><th class="num">Осталось дней</th></tr></thead><tbody>` +
    list.map(p => `<tr>
      <td>${esc(problemName(p.type))}</td>
      <td class="prio-${esc(p.priority)}">${esc(p.priority)}</td>
      <td>${p.street ? esc(pretty(p.street) + ', ' + p.number) : '—'}</td>
      <td>${p.item ? esc(pretty(p.item)) : '—'}</td>
      <td class="num">${p.remainingDays ?? '—'}</td>
    </tr>`).join('') + '</tbody></table>';
}

function renderProblems() {
  const el = document.getElementById('problemsList');
  const order = { Critical: 0, High: 1, Medium: 2, Low: 3 };
  const list = [...snap.problems].sort((a, b) => (order[a.priority] ?? 9) - (order[b.priority] ?? 9));
  el.innerHTML = list.length ? problemsTable(list) : '<div class="empty">Проблем нет 🎉</div>';
  const badge = document.getElementById('problemsBadge');
  badge.style.display = list.length ? '' : 'none';
  badge.textContent = list.length;
}

function renderInventory() {
  const sel = document.getElementById('invBuilding');
  const buildings = snap.businesses.filter(b => (b.inventory || []).length);

function itemName(r) { return r.name || pretty(r.item); }

function daysLeftCell(r) {
  if (r.daysLeft == null) return '<span style="color:var(--muted)">—</span>';
  const d = r.daysLeft;
  const color = d <= 3 ? 'var(--red)' : d <= 7 ? 'var(--yellow)' : 'var(--green)';
  const label = d < 1 ? '<1 дня' : d < 100 ? d + ' дн.' : d + ' дн.';
  return `<b style="color:${color}">${label}</b>`;
}

    const shownSales = (b.sales || []).filter(r => !filter || itemName(r).toLowerCase().includes(filter));

  document.querySelectorAll('#salesTables canvas.sales-day-chart').forEach(cv => {

  document.querySelectorAll('#salesTables tr.clickable').forEach(tr => {
    tr.addEventListener('click', () => { salesSel[tr.dataset.b] = tr.dataset.item; renderSales(); });

function skillColor(v) { return v >= 66 ? 'var(--green)' : v >= 33 ? 'var(--yellow)' : 'var(--red)'; }
function constraintNote(e) {
  const c = e.constraints; if (!c) return '';
  const parts = [];
  if ((c.freeDays || []).length) parts.push('🚫 ' + c.freeDays.map(dayRu).join(','));
  if ((c.noShiftHours || []).length) parts.push('⛔ ' + c.noShiftHours.map(r => r.from + '–' + r.to).join(','));
  if (c.daysPerWeek) parts.push('📅 ' + c.daysPerWeek + ' дн.');
  if (noCleaningOf(e)) parts.push('🚫🧹');
  return parts.length ? ` <span style="color:var(--red)">· ${esc(parts.join(' '))}</span>` : '';
}
function constraintChips(e) {
  const c = e.constraints; if (!c && !e.absent) return '';
  const chips = [];
  if (e.absent) chips.push(`<span class="chip" style="color:var(--yellow)">🤒 на больничном${e.replaced ? ' (есть замена)' : ''}</span>`);
  if (!c) return `<div style="margin-top:4px">${chips.join('')}</div>`;
  (c.freeDays || []).forEach(d => chips.push(`<span class="chip" style="color:var(--red)">🚫 свободен: ${esc(dayRu(d))}</span>`));
  (c.noShiftHours || []).forEach(r => chips.push(`<span class="chip" style="color:var(--red)">⛔ не работает ${r.from}–${r.to}</span>`));
  if (c.daysPerWeek) chips.push(`<span class="chip" style="color:var(--yellow)">📅 ровно ${c.daysPerWeek} дн./нед.</span>`);
  if (noCleaningOf(e)) chips.push(`<span class="chip" style="color:var(--red)">🚫🧹 без смен по уборке</span>`);
  if (c.maxHours != null) chips.push(`<span class="chip">макс. ${c.maxHours} ч/нед</span>`);
  return chips.length ? `<div style="margin-top:4px">${chips.join('')}</div>` : '';
}
function skillsBlock(skills) {
  if (!skills || !skills.length) return '';
  const rows = [...skills].sort((a, b) => b.value - a.value).map(s => `
    <div class="skill-row"><span class="sk-name">${esc(s.name)}</span>
      <span class="sk-track"><span class="sk-fill" style="width:${Math.max(2, s.value)}%;background:${skillColor(s.value)}"></span></span>
      <span class="sk-val">${s.value}</span></div>`).join('');
  return `<div class="skills">${rows}</div>`;
}

function hourRange(days) {
  let min = 24, max = 0;
  days.forEach(d => (d.open || []).forEach(s => { min = Math.min(min, s.from); max = Math.max(max, s.to); }));
  days.forEach(d => (d.shifts || []).forEach(s => { min = Math.min(min, s.from); max = Math.max(max, s.to); }));
  if (min >= max) { min = 8; max = 22; }
  return [Math.max(0, min), Math.min(24, max)];
}

function renderStaffView(b, el) {

  const hours = []; for (let h = h0; h < h1; h++) hours.push(h);

  const isOpen = (d, h) => (d.open || []).some(s => h >= s.from && h < s.to);
  const shiftAt = (d, h) => (d.shifts || []).find(s => h >= s.from && h < s.to);

  let grid = `<div class="sched"><table><thead><tr><th class="dname">День</th>` +
    hours.map(h => `<th>${h}</th>`).join('') + `<th>Часы</th></tr></thead><tbody>`;

  const coverage = totalOpen > 0 ? Math.round((totalOpen - totalGap) / totalOpen * 100) : 100;
  const covColor = coverage >= 90 ? 'var(--green)' : coverage >= 60 ? 'var(--yellow)' : 'var(--red)';

  const emps = (st.employees || []).map(e => {

      <div class="row"><span class="k" style="color:var(--muted)">Ставка</span> <b>${fmtMoney(e.wage)}/ч</b></div>
      ${skillsBlock(e.skills)}
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Часы за неделю: ${e.workedThisWeek} / ${e.weeklyHours}</div>
      <div class="hbar"><div style="width:${pct}%;background:${pct >= 100 ? 'var(--red)' : 'var(--accent)'}"></div></div>
      <div style="margin-top:6px">${(e.days || []).map(d => `<span class="chip">${esc(dayRu(d))}</span>`).join('') || '<span style="color:var(--muted);font-size:12px">дни не назначены</span>'}</div>
      ${(e.zones || []).length ? `<div style="margin-top:4px">${e.zones.map(z => `<span class="chip">📍 ${esc(z)}</span>`).join('')}</div>` : ''}
      ${constraintChips(e)}
